[project]
name = "myopyc"
version = "0.1.0"
description = "Dongleless Thalmic Myo EMG/IMU capture and visualization for up to two armbands"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "acabtech" }]
keywords = ["myo", "emg", "imu", "ble", "bluetooth", "biosignals"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]

dependencies = [
    "numpy>=1.26",
    "pyside6>=6.6,<6.9",
    "pyqtgraph>=0.13.3,<0.14",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
hardware = ["dl-myo>=1.1.8"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
myopyc = "myopyc.cli:main"

[project.urls]
Repository = "https://github.com/acabtech/myopyc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myopyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=myopyc --cov-report=term-missing --cov-fail-under=70"
markers = [
    "slow: process-bound crash-safety tests (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = ["upstream", "plans", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["myopyc"]

[tool.mypy]
python_version = "3.11"
files = ["src/myopyc", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["myopyc"]

[tool.coverage.report]
# Milestone 73 (v0.1.0): initial coverage floor for src/myopyc, enforced in CI
# and by coverage tooling. Raise this as the suite grows.
fail_under = 70
show_missing = true
