# Linux-only stance: myopyc explicitly targets Linux (BlueZ/dongleless BLE via
# dl-myo); Windows/macOS support is an unassigned icebox item, so CI runs on a
# single ubuntu-latest runner only.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-shape0
      - name: Install
        run: uv sync --extra dev
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src/myopyc tests
      # Headless Qt UI smoke tests (tests/test_ui_status_health.py) require a
      # Qt platform plugin without a display server.
      - name: Test
        run: |
          export QT_QPA_PLATFORM=offscreen
          uv run pytest --cov=myopyc --cov-report=term-missing --cov-fail-under=70
